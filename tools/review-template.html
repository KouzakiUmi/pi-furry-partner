<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umi · 双端动作适配预览</title>
<style>:root{color-scheme:dark;font:15px/1.7 system-ui;background:#101722;color:#ecf2fb}*{box-sizing:border-box}body{max-width:1180px;margin:auto;padding:24px}h1{font-size:28px;line-height:1.3}p{color:#adbed3}.badge{font-size:12px;background:#253c57;color:#badaff;padding:6px 12px;border-radius:30px}.tools{display:flex;flex-wrap:wrap;gap:9px;margin:18px 0}button,select{color:inherit;border:1px solid #405c7c;background:#223650;padding:8px 12px;font:inherit;border-radius:8px;cursor:pointer}button.active{background:#315d88}.grid{display:grid;grid-template-columns:1.2fr 1fr;gap:20px}.card{border:1px solid #344961;background:#192536;padding:20px;border-radius:16px;min-width:0}canvas{display:block;background:#353b46;width:100%;height:auto;border-radius:10px}h2{font-size:18px;margin-top:0}.status{font-family:ui-monospace,monospace;font-size:12px;white-space:pre-wrap;word-break:break-word}.good{color:#a2dfb4}.note{padding:14px;background:#1c3046;border-left:3px solid #72aee0}a{color:#8fceff}@media(max-width:760px){.grid{grid-template-columns:1fr}body{padding:16px}}</style>
<span class="badge">17 段已验收 · 双端适配检查 · 尚未安装</span><h1>状态切换时，呜咪留在同一个位置</h1><p>使用实际 DSH 构建的控制器与批准序列。插画按构建选择高清简单帧或完整动作；像素统一使用原100px原画与旧简单帧。虚线框是固定的 640 逻辑视口，十字是共同支撑锚点。</p>
<div class="tools"><button id="tour">连续切换</button><button data-phase="idle">待机</button><button data-phase="editing">敲键盘</button><button data-phase="thinking">思考</button><button id="listen">倾听</button><button data-phase="waiting">等待／打瞌睡</button><button data-phase="running">放大镜</button><button data-phase="searching">埋头搜索</button><button data-phase="speaking">说话</button><button data-phase="error">错误</button></div>
<div class="tools"><label>画风 <select id="style"><option value="umi">插画</option><option value="umi-pixel">像素</option></select></label><label>背景 <select id="bg"><option value="#353b46">灰色</option><option value="#000000">黑色</option><option value="#ffffff">白色</option></select></label><label><input id="animate" type="checkbox" checked> 表情动画</label><label><input id="guides" type="checkbox" checked> 显示锚点</label><button id="short">快速进入／离开键盘</button><button id="interrupt">说话打断键盘</button></div>
<div class="grid"><article class="card"><h2 id="heading">正在载入批准动作…</h2><canvas id="screen" width="960" height="1152"></canvas><p id="copy"></p></article><article class="card"><h2>九种表情</h2><div class="tools" id="emotions"></div><h2>实际绘制状态</h2><pre class="status" id="status"></pre><div class="note">这里检查的是运行适配：角色尺度、锚点、帧序、键盘进入与退出，以及动画开关。原始批准画面保持不变，普通版 2.4.1 的安装仍保留。</div><p id="error" style="color:#ffb6bc"></p></article></div>
<script>let bundleEntry;window.__ModuleLoader__={load(entry){bundleEntry=entry}};</script><script src="/lib/client.js"></script><script>
const plugin=bundleEntry.factory(()=>({}));const controller=plugin.createMascotController({fetchImpl:window.fetch.bind(window)});
const canvas=document.querySelector('#screen'),ctx=canvas.getContext('2d');let tourActive=false,tourStart=0,stepKey='',shortTimers=[];
const actions=[['idle',2600],['editing',5200],['idle',1400],['thinking',3000],['listen',2400],['waiting',12500],['running',2800],['searching',3000],['speaking',2600],['idle',1800]];
function phase(id){const a=controller.activity;a.setDemo('off');a.start({wake:false,isBusy:['thinking','editing','running','searching','speaking'].includes(id)});if(id==='listen')a.noteTyping();else if(id==='waiting')a.handle('ui_prompt_start');else if(id==='speaking')a.handle('message_update',{assistantMessageEvent:{type:'text_delta'}});else if(id==='error'){a.handle('agent_before_settle',{outcome:'error'});a.handle('agent_settled')}else if(['editing','running','searching'].includes(id))a.handle('tool_execution_start',{toolCallId:'preview-current',toolName:{editing:'write',running:'bash',searching:'search'}[id],args:{path:'preview.txt'}});controller.notifyChange()}
function stopTour(){tourActive=false;document.querySelector('#tour').textContent='连续切换';shortTimers.forEach(clearTimeout);shortTimers=[]}
document.querySelectorAll('[data-phase]').forEach(b=>b.onclick=()=>{stopTour();phase(b.dataset.phase)});
document.querySelector('#listen').onclick=()=>{stopTour();phase('listen')};
document.querySelector('#tour').onclick=()=>{stopTour();tourActive=true;tourStart=performance.now();stepKey='';document.querySelector('#tour').textContent='正在连续切换'};
document.querySelector('#style').onchange=e=>controller.applySettingsLocal({style:e.target.value});
document.querySelector('#animate').onchange=e=>controller.applySettingsLocal({animation:e.target.checked});
document.querySelector('#short').onclick=()=>{stopTour();phase('idle');shortTimers.push(setTimeout(()=>phase('editing'),300),setTimeout(()=>phase('idle'),480))};
document.querySelector('#interrupt').onclick=()=>{stopTour();phase('editing');shortTimers.push(setTimeout(()=>phase('speaking'),160))};
for(const [id,label] of [['joy','开心'],['grumpy','小生气'],['sad','难过'],['cry','哭泣'],['shy','害羞'],['flustered','慌张'],['surprise','惊讶'],['proud','小得意'],['affection','亲近']]){
 const b=document.createElement('button');b.textContent=label;b.onclick=()=>{stopTour();phase('idle');controller.activity.start({wake:false});controller.playGesture(id);controller.notifyChange()};document.querySelector('#emotions').append(b)}
document.querySelectorAll('button,input,select').forEach(el=>el.disabled=true);
async function init(){try{await controller.init();controller.activity.start({wake:false});controller.notifyChange();document.querySelector('#heading').textContent='实际控制器 · 待机';window.umiReview={controller};document.querySelectorAll('button,input,select').forEach(el=>el.disabled=false);requestAnimationFrame(draw)}catch(e){document.querySelector('#error').textContent=e.message}}
function draw(t){
 if(tourActive){let age=(t-tourStart)%actions.reduce((n,a)=>n+a[1],0),idx=0;for(;idx<actions.length-1&&age>=actions[idx][1];idx++)age-=actions[idx][1];if(stepKey!==String(idx)){stepKey=String(idx);phase(actions[idx][0])}}
 controller.notifyChange();const state=controller.getSnapshot(),layer=controller.getRenderLayer();ctx.imageSmoothingEnabled=state.settings?.style!=='umi-pixel';ctx.fillStyle=document.querySelector('#bg').value;ctx.fillRect(0,0,960,1152);ctx.save();ctx.translate(160,160);
 if(layer?.bitmap){ctx.save();if(layer.display){ctx.globalAlpha=layer.display.opacity??1;ctx.translate(layer.display.x||0,layer.display.y||0);ctx.scale(layer.display.scale??1,layer.display.scale??1)}
 const p=layer.paintRect||{x:0,y:0,width:640,height:640};if(layer.transform){const m=layer.transform,cx=320,cy=640*(m.anchorY??.5);ctx.translate(cx+(m.dx||0),cy+(m.dy||0));ctx.rotate(m.angleRad||0);ctx.scale(m.scale??1,m.scale??1);ctx.drawImage(layer.bitmap,-cx,-cy,640,640)}else ctx.drawImage(layer.bitmap,p.x,p.y,p.width,p.height);ctx.restore()}
 if(document.querySelector('#guides').checked){ctx.strokeStyle='#8eacd1';ctx.lineWidth=1.5;ctx.setLineDash([8,8]);ctx.strokeRect(0,0,640,640);ctx.setLineDash([]);ctx.strokeStyle='#ffdc7c';ctx.beginPath();ctx.moveTo(306,608);ctx.lineTo(334,608);ctx.moveTo(320,594);ctx.lineTo(320,622);ctx.stroke()}ctx.restore();
 document.querySelector('#heading').textContent=(state.snapshot?.label||state.snapshot?.phase||'待机')+' · '+(layer?.hiRes?'高清原帧':'indexed');
 document.querySelector('#copy').textContent=state.snapshot?.phrase||state.snapshot?.hint||'';
 document.querySelector('#status').textContent=JSON.stringify({phase:state.snapshot?.phase,visualPhase:state.snapshot?.visualPhase,reaction:state.snapshot?.reaction,frame:state.visual?.frame?.id,paintRect:layer?.paintRect,display:layer?.display,approvedMotion:state.approvedMotion?{clipId:state.approvedMotion.clipId,elapsedMs:Math.round(state.approvedMotion.elapsedMs),frame:state.approvedMotion.frame?.id,transition:state.approvedMotion.transition}:null,approvedMotionReady:state.approvedMotionReady,cache:controller.cacheStats?.()},null,2);
 requestAnimationFrame(draw);
}init();</script></html>
