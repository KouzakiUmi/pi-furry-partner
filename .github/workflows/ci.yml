name: Verify plugin

on:
  push:
    branches: [legacy]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  optional-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Build and verify the preserved static website
        run: |
          npm run build:site
          npm run test:site
  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        pi-version: ['1.2.0', '1.3.0']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install the verified Pi runtime for tests
        run: npm install --prefix work/pi-runtime --no-save --no-audit --no-fund @earendil-works/pi-coding-agent@${{ matrix.pi-version }} @earendil-works/pi-tui@${{ matrix.pi-version }}
      - name: Run runtime and integration suites
        shell: pwsh
        run: |
          $env:PI_TEST_MODULES = Join-Path $PWD 'work/pi-runtime/node_modules'
          $env:PI_TEST_VERSION = '${{ matrix.pi-version }}'
          npm test
      - name: Verify PowerShell 7 install, upgrade and recovery
        shell: pwsh
        run: ./tests/installer.ps1 -WorkDir ./work/installer-core
      - name: Verify Windows PowerShell 5.1 install, upgrade and recovery
        shell: powershell
        run: ./tests/installer.ps1 -WorkDir ./work/installer-desktop
