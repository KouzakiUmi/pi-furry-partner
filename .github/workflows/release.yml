name: Build and publish Legacy release

on:
  push:
    tags: ['legacy-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Validate version and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git fetch origin legacy:refs/remotes/origin/legacy
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/legacy
          node scripts/verify-legacy-line.mjs --tag "$RELEASE_TAG" --notes-file release-notes.md
      - name: Package tracked source and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="pi-furry-partner-legacy-${RELEASE_TAG#legacy-v}.zip"
          git archive --format=zip --prefix=pi-furry-partner/ --output="$archive" "$RELEASE_TAG"
          unzip -t "$archive"
          mkdir -p work/release-archive-check
          unzip -q "$archive" -d work/release-archive-check
          node work/release-archive-check/pi-furry-partner/tests/legacy-resources.mjs
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "pi-furry-partner-legacy-${RELEASE_TAG#legacy-v}.zip" \
            "pi-furry-partner-legacy-${RELEASE_TAG#legacy-v}.zip.sha256" \
            --verify-tag --latest=false \
            --title "Umi · Legacy ${RELEASE_TAG} · 原资源维护版 · Pi" \
            --notes-file release-notes.md
