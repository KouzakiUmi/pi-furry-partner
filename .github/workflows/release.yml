name: Build and publish Pi release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing original-resource tag to verify and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ inputs.tag || github.ref }}
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Validate version and extract release notes
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          git fetch origin main:refs/remotes/origin/main
          git merge-base --is-ancestor "$(git rev-parse HEAD)" refs/remotes/origin/main
          node scripts/verify-legacy-line.mjs --tag "$RELEASE_TAG" --notes-file release-notes.md
      - name: Package tracked source and checksum
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          archive="pi-furry-partner-${RELEASE_TAG#v}.zip"
          if [[ -f flake.nix ]]; then
            # New release tags publish the same deterministic Nix output CI
            # already built. Historical tags predate the flake and use the
            # original git-archive path below.
            nix build --print-build-logs --out-link release-package .#pi-original-zip
            cp "release-package/$archive" "$archive"
            cp "release-package/$archive.sha256" "$archive.sha256"
          else
            python scripts/package-pi-release.py --tag "$RELEASE_TAG" --out "$archive"
            sha256sum "$archive" > "$archive.sha256"
          fi
          sha256sum --check "$archive.sha256"
          unzip -t "$archive"
          mkdir -p work/release-archive-check
          unzip -q "$archive" -d work/release-archive-check
          node work/release-archive-check/pi-furry-partner/tests/legacy-resources.mjs
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "pi-furry-partner-${RELEASE_TAG#v}.zip" \
            "pi-furry-partner-${RELEASE_TAG#v}.zip.sha256" \
            --verify-tag --latest \
            --title "Umi · ${RELEASE_TAG} · Pi 原资源版" \
            --notes-file release-notes.md
