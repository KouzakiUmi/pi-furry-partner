name: CI · Pi original resources

on:
  push:
    branches: [main]
    paths: ['**', '!editions/hd/**', 'editions/hd/test-runtimes/**', '!.github/workflows/ci-hd.yml', '!.github/workflows/release-hd.yml']
  pull_request:
    branches: [main]
    paths: ['**', '!editions/hd/**', 'editions/hd/test-runtimes/**', '!.github/workflows/ci-hd.yml', '!.github/workflows/release-hd.yml']
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Exact source ref requested by the release workflow
        required: false
        type: string

permissions:
  contents: read

jobs:
  legacy-line:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7; fallback for historical tag reruns without flake.nix
        with:
          node-version: '24'
      - name: Verify the original-resource release line
        run: |
          if [[ -f flake.nix ]]; then
            nix develop .#default --command bash -euo pipefail -c '
              node scripts/verify-legacy-line.mjs
              node tests/legacy-release.mjs
              node tests/legacy-resources.mjs
            '
          else
            node scripts/verify-legacy-line.mjs
            node tests/legacy-release.mjs
            node tests/legacy-resources.mjs
          fi
  optional-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7; fallback for historical tag reruns without flake.nix
        with:
          node-version: '24'
      - name: Build and verify the preserved static website package
        run: |
          if [[ -f flake.nix ]]; then
            nix build .#site-original
          else
            npm run build:site
            npm run test:site
          fi
  nix-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - name: Build the installable original-resource package
        run: |
          if [[ -f flake.nix ]]; then
            nix build --print-build-logs .#pi-original-extension
          else
            # Historical refs requested by the release workflow predate the
            # flake; they ship their own archive and have no package output.
            echo 'Skipped: this ref has no flake.nix.'
          fi
      # Covers the --source path of scripts/package-pi-release.py, which the
      # release workflow never exercises because it packs by tag instead.
      - name: Build the deterministic source archive
        run: |
          if [[ -f flake.nix ]]; then
            nix build --print-build-logs .#pi-original-zip
          else
            echo 'Skipped: this ref has no flake.nix.'
          fi
  windows:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        pi-version: ['1.2.0', '1.3.0', '1.4.0', '1.5.0', '1.6.1']
    env:
      PI_TEST_VERSION: ${{ matrix.pi-version }}
      PI_SOURCE_REF: ${{ inputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Install the locked Pi runtime and run the integration suite
        shell: pwsh
        run: |
          $runtime = 'editions/hd/test-runtimes/pi-' + ($env:PI_TEST_VERSION -replace '\.[0-9]+$', '')
          if (Test-Path "$runtime/package-lock.json") {
            npm ci --prefix $runtime --ignore-scripts --no-audit --no-fund
          } elseif ($env:PI_SOURCE_REF -match '^(refs/tags/)?v[0-9]') {
            # Manual release reruns may check out a tag older than this workflow.
            if ($env:PI_TEST_VERSION -eq '1.6.1') {
              Write-Host "Pi 1.6.1 has no reviewed runtime at $env:PI_SOURCE_REF"
              return
            }
            $runtime = 'work/pi-runtime'
            npm install --prefix $runtime --no-save --ignore-scripts --no-audit --no-fund "@earendil-works/pi-coding-agent@$env:PI_TEST_VERSION" "@earendil-works/pi-tui@$env:PI_TEST_VERSION"
          } else {
            throw "Missing Pi test lockfile: $runtime/package-lock.json"
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:PI_TEST_MODULES = Join-Path $PWD "$runtime/node_modules"
          npm test
      - name: Verify PowerShell 7 install, upgrade and recovery
        shell: pwsh
        run: ./tests/installer.ps1 -WorkDir ./work/installer-core
      - name: Verify Windows PowerShell 5.1 install, upgrade and recovery
        shell: powershell
        run: ./tests/installer.ps1 -WorkDir ./work/installer-desktop
