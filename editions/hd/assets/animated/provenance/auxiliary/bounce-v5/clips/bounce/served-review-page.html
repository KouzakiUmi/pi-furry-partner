<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>呜咪 · 辅助动作原速评审</title>
<style>:root{--matte:#000}*{box-sizing:border-box}body{margin:0;background:#141c28;color:#eaf1ff;font:16px/1.7 system-ui,sans-serif}main{max-width:1180px;margin:28px auto;padding:0 24px}h1{font-size:27px}h2{font-size:21px}p{color:#c6d5eb}button{font:inherit;background:#bcd9ff;border:0;border-radius:7px;padding:8px 15px;margin:3px 8px 3px 0;cursor:pointer}button.active{outline:2px solid #edc56f;background:#e0edff}.pair{display:grid;grid-template-columns:1fr 1fr;gap:22px}figure{margin:0}img,video{width:100%;display:block;background:var(--matte);border-radius:10px}figcaption{padding:8px 0}.note{border-left:3px solid #efc870;background:#263247;padding:13px 18px}small{color:#afc3df}input{width:70%}#frames{max-width:640px}@media(max-width:740px){.pair{grid-template-columns:1fr}}</style>
<main><h1>辅助动作 · 原速与透明边缘评审</h1><p>表演原片已经过你确认。本页复核透明蒙版与边缘处理，保留原生1×时间和完整107帧；左为原二维身份/配色参考，右为完整896px世界画布，人物不缩小。请切换黑、灰、白底检查斗篷与毛尖，以及眼星、嘴线等内部细节。评审完成后关闭服务器，需要重看时再启动。</p><nav id="actions"></nav><p><button onclick="background('black','#000')">黑底</button><button onclick="background('gray','#7f7f7f')">灰底</button><button onclick="background('white','#fff')">白底</button><button onclick="restart()">从头播放</button><button onclick="toggle()">暂停／播放</button></p>
<div class="pair"><figure><img id="reference"><figcaption>批准的二维基准 · 身份、配色与尺度对照</figcaption></figure><figure><video id="movie" muted playsinline loop controls preload="auto"></video><figcaption id="caption"></figcaption></figure></div><div class="note"><strong id="name"></strong><div id="note"></div><small>新候选尚未进入正式资源；评审通过后才接入两端。技术检查不能代替动作、造型和配色验收。</small></div>
<h2>同一份无损 RGBA 帧</h2><p>拖动暂停视频。下图直接显示透明 PNG；黑／灰／白底按钮同时作用于视频预览和无损帧。</p><p><input id="slider" type="range" min="0" max="106" value="0" oninput="frame(this.value)"> <span id="frameLabel"></span></p><img id="frames"><p><small>视频预览有压缩；细边以无损 PNG 为准。已知细暗边、毛尖或底缘颗粒按各片说明披露。</small></p></main>
<script>const items={"bounce": {"label": "开心小弹 · 最终透明候选", "note": "表演沿用你已确认的双爪贴地小弹，107帧与原速保持；仅恢复3970个眼内误透明点，右袖与斗篷之间真实窄缝保留。黑／灰／白底可切换，下方为无损PNG。白底掌底与白毛尖仍有细暗紫及少量灰绿暗粒，帽沿和袖缝旁也可能看到细彩边；原始低alpha边缘RGB有亮黄绿，正常合成可见度更低。本次只确认最终透明细节，未进入正式资源；你给出评审结果后关闭服务器。"}},movie=document.querySelector('#movie');let active=Object.keys(items)[0],matte='black';
for(const [id,item]of Object.entries(items)){const b=document.createElement('button');b.textContent=item.label;b.dataset.id=id;b.onclick=()=>select(id);document.querySelector('#actions').append(b)}
function updateFrame(){const i=document.querySelector('#slider').value;document.querySelector('#frames').src='/frame.png?id='+encodeURIComponent(active)+'&i='+i;document.querySelector('#frameLabel').textContent=String(i).padStart(3,'0')+' / 106'}
function select(id){movie.pause();active=id;document.querySelector('#reference').src='/reference.png?id='+encodeURIComponent(id);document.querySelector('#name').textContent=items[id].label;document.querySelector('#note').textContent=items[id].note;document.querySelector('#caption').textContent=items[id].label+' · 完整原速循环 · 1×';for(const b of document.querySelectorAll('[data-id]'))b.classList.toggle('active',b.dataset.id===id);document.querySelector('#slider').value=0;updateFrame();movie.src='/video.mp4?id='+encodeURIComponent(id)+'&bg='+matte;movie.play().catch(()=>{})}
function background(name,color){const time=movie.currentTime,paused=movie.paused;matte=name;document.documentElement.style.setProperty('--matte',color);movie.src='/video.mp4?id='+encodeURIComponent(active)+'&bg='+name;movie.addEventListener('loadedmetadata',()=>{movie.currentTime=Math.min(time,movie.duration||time);if(!paused)movie.play().catch(()=>{})},{once:true})}
function restart(){movie.currentTime=0;movie.play().catch(()=>{})}function toggle(){movie.paused?movie.play().catch(()=>{}):movie.pause()}function frame(){movie.pause();updateFrame()}movie.addEventListener('ratechange',()=>{if(movie.playbackRate!==1)movie.playbackRate=1});const initial=decodeURIComponent(location.hash.slice(1));select(items[initial]?initial:active);</script></html>
