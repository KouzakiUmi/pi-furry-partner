name: Build and publish Legacy release

on:
  push:
    tags: ['legacy-v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - name: Validate version and extract release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const { version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (!/^2\.4\.\d+$/.test(version)) throw new Error('Legacy releases must use a stable2.4.x version');
          if (Number(version.split('.')[2]) < 2) throw new Error('Historical2.4.0/2.4.1 releases must not be duplicated under new tags');
          if (process.env.RELEASE_TAG !== `legacy-v${version}`) throw new Error('Legacy tag must match legacy-v plus package version');
          const changelog = readFileSync('CHANGELOG.md', 'utf8');
          const section = changelog.split(/^## /m).find(text => text.startsWith(`${version} · `));
          if (!section) throw new Error('Missing changelog section');
          writeFileSync('release-notes.md', section.slice(section.indexOf('\n') + 1).trim() + '\n');
          NODE
      - name: Package tracked source and checksum
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          archive="pi-furry-partner-legacy-${RELEASE_TAG#legacy-v}.zip"
          git archive --format=zip --prefix=pi-furry-partner/ --output="$archive" "$RELEASE_TAG"
          unzip -t "$archive"
          mkdir -p work/release-archive-check
          unzip -q "$archive" -d work/release-archive-check
          node work/release-archive-check/pi-furry-partner/tests/legacy-resources.mjs
          sha256sum "$archive" > "$archive.sha256"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "pi-furry-partner-legacy-${RELEASE_TAG#legacy-v}.zip" \
            "pi-furry-partner-legacy-${RELEASE_TAG#legacy-v}.zip.sha256" \
            --verify-tag --latest=false \
            --title "Umi · Legacy ${RELEASE_TAG} · 原资源维护版 · Pi" \
            --notes-file release-notes.md
